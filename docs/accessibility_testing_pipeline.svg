<svg width="900" height="1020" viewBox="0 0 900 1020" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Accessibility and usability testing pipeline</title>
<desc>Full pipeline from website capture through analysis, disparity comparison, LLM interpretation, to final report.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="0" y="0" width="900" height="1020" fill="#FFFFFF"/>

<!-- Website -->
<g>
  <rect x="330" y="30" width="240" height="50" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="450" y="55" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="15" font-weight="600" fill="#2C2C2A">Website</text>
  <text x="450" y="73" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">Software under test</text>
</g>
<line x1="450" y1="80" x2="450" y2="120" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Playwright -->
<g>
  <rect x="330" y="120" width="240" height="50" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="450" y="140" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="15" font-weight="600" fill="#2C2C2A">Playwright</text>
  <text x="450" y="158" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">Browser control and data collection</text>
</g>

<!-- Split arrows to capture row -->
<line x1="390" y1="170" x2="180" y2="220" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="450" y1="170" x2="450" y2="220" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="510" y1="170" x2="720" y2="220" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Capture row -->
<g>
  <rect x="60" y="220" width="240" height="56" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="180" y="240" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="#26215C">DOM / HTML</text>
  <text x="180" y="260" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">Structure and elements</text>
</g>
<g>
  <rect x="330" y="220" width="240" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="450" y="240" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="#04342C">Screenshot</text>
  <text x="450" y="260" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">Visual UI appearance</text>
</g>
<g>
  <rect x="600" y="220" width="240" height="56" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="720" y="240" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="#4A1B0C">Accessibility tree</text>
  <text x="720" y="260" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#712B13">Accessibility semantics</text>
</g>

<line x1="180" y1="276" x2="180" y2="330" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="450" y1="276" x2="450" y2="330" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="720" y1="276" x2="720" y2="330" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Analyzer row -->
<g>
  <rect x="60" y="330" width="240" height="56" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="180" y="350" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="#26215C">Text analyzer</text>
  <text x="180" y="370" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">Gendered language, wording, readability</text>
</g>
<g>
  <rect x="330" y="330" width="240" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="450" y="350" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="#04342C">Vision analyzer</text>
  <text x="450" y="370" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">Layout, hierarchy, clutter</text>
</g>
<g>
  <rect x="600" y="330" width="240" height="56" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="720" y="350" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="#4A1B0C">Accessibility rules</text>
  <text x="720" y="370" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#712B13">Labels, roles, keyboard nav</text>
</g>

<line x1="180" y1="386" x2="380" y2="440" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="450" y1="386" x2="450" y2="440" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="720" y1="386" x2="520" y2="440" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Rule Engine -->
<g>
  <rect x="330" y="440" width="240" height="60" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="450" y="460" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="15" font-weight="600" fill="#2C2C2A">Rule engine</text>
  <text x="450" y="480" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">Size, distance, contrast, spacing, touch targets</text>
</g>
<line x1="450" y1="500" x2="450" y2="550" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Evidence Store -->
<g>
  <rect x="300" y="550" width="300" height="70" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="450" y="573" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="15" font-weight="600" fill="#2C2C2A">Evidence store</text>
  <text x="450" y="595" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">UI metrics, findings, logs, test results</text>
</g>
<line x1="450" y1="620" x2="450" y2="670" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Disparity Engine -->
<g>
  <rect x="270" y="670" width="360" height="70" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="450" y="693" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="15" font-weight="600" fill="#26215C">Disparity engine</text>
  <text x="450" y="715" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">Compares user profiles / groups: success rate, time, errors, failures</text>
</g>
<line x1="450" y1="740" x2="450" y2="790" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- LLM Analyst -->
<g>
  <rect x="290" y="790" width="320" height="70" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="450" y="813" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="15" font-weight="600" fill="#04342C">LLM analyst</text>
  <text x="450" y="835" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">Evidence-based interpretation, causes and improvements</text>
</g>
<line x1="450" y1="860" x2="450" y2="910" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Report -->
<g>
  <rect x="310" y="910" width="280" height="70" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/>
  <text x="450" y="933" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="15" font-weight="600" fill="#2C2C2A">Report</text>
  <text x="450" y="955" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">Findings, disparities, evidence, causes, recommendations</text>
</g>

</svg>
